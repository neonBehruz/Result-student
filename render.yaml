services:
  - type: web
    name: result-student
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: result-student-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true

databases:
  - name: result-student-db
    plan: free
    databaseName: result_student
    user: result_user
